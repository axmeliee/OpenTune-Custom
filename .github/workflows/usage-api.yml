name: Usage API
on:
  push:
    branches: [main]
    paths: ["usage-api/**", ".github/workflows/usage-api.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: usage-api-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test usage-api/worker.test.mjs
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Usage API not deployed: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then rerun this workflow. The website uses limited last-30-day reporting until deployment."
            echo "Usage API deployment skipped: Cloudflare credentials are not configured. Website remains in limited reporting mode." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy existing Worker and database binding
        if: steps.credentials.outputs.ready == 'true'
        working-directory: usage-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
