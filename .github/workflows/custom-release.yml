name: Custom stable release

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [custom]
    paths: ['custom/**', '.github/workflows/custom-release.yml']

concurrency:
  group: custom-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  release:
    if: github.repository == 'axmeliee/OpenTune-Custom'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - name: Capture exact automation source before keepalive
        run: echo "OPENTUNE_AUTOMATION_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep idle public schedule active every 28 days
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python custom/pipeline.py keepalive "$DEFAULT_BRANCH"
      - name: Pipeline tests
        run: python -m unittest discover -s custom/tests -v
      - name: Select exact stable release and verify existing assets
        id: plan
        run: python custom/pipeline.py plan custom/app.patch
      - uses: actions/setup-java@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Require original signing key
        if: steps.plan.outputs.skip != 'true'
        env:
          OPENTUNE_KEYSTORE_BASE64: ${{ secrets.OPENTUNE_KEYSTORE_BASE64 }}
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: |
          python custom/pipeline.py signing "$RUNNER_TEMP/release.keystore"
          echo "OPENTUNE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Prepare isolated upstream source
        if: steps.plan.outputs.skip != 'true'
        env:
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
        run: |
          git init "$RUNNER_TEMP/source"
          git -C "$RUNNER_TEMP/source" remote add upstream https://github.com/justshivv/Opentune.git
          git -C "$RUNNER_TEMP/source" fetch --depth=1 upstream "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/source" checkout --detach FETCH_HEAD
          python custom/pipeline.py prepare "$RUNNER_TEMP/source" custom/app.patch plan.json
          git -C "$RUNNER_TEMP/source" config user.name 'OpenTune Custom builder'
          git -C "$RUNNER_TEMP/source" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$RUNNER_TEMP/source" add -A
          # Deterministic commit: an interrupted draft release can be resumed safely.
          stamp=$(git -C "$RUNNER_TEMP/source" show -s --format=%cI HEAD)
          GIT_AUTHOR_DATE="$stamp" GIT_COMMITTER_DATE="$stamp" git -C "$RUNNER_TEMP/source" commit -m "OpenTune Custom ${{ steps.plan.outputs.tag }}"
          echo "SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/source" rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: android-actions/setup-android@v3
        if: steps.plan.outputs.skip != 'true'
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
        if: steps.plan.outputs.skip != 'true'
      - name: Verify behavior and build signed universal APK
        if: steps.plan.outputs.skip != 'true'
        working-directory: ${{ runner.temp }}/source
        env:
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
          OPENTUNE_KEY_PASSWORD: ${{ secrets.OPENTUNE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PuniversalOnly=true testDebugUnitTest \
            --tests 'com.opentune.data.library.PlaylistInsertionTest' \
            --tests 'com.opentune.data.library.PlaylistSyncTest' \
            --tests 'com.opentune.data.SettingsDefaultsTest' \
            --tests 'com.opentune.ui.library.PlaylistToolsScreenshotTest.newSongsFirst*' \
            --tests 'com.opentune.data.UpdateCheckTest' \
            --tests 'com.opentune.data.UpdaterCacheTest'
          ./gradlew --no-daemon -PuniversalOnly=true assembleRelease
      - name: Verify APK metadata and original signing certificate
        if: steps.plan.outputs.skip != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          OPENTUNE_KEYSTORE_PASSWORD: ${{ secrets.OPENTUNE_KEYSTORE_PASSWORD }}
          OPENTUNE_KEY_ALIAS: ${{ secrets.OPENTUNE_KEY_ALIAS }}
        run: |
          mkdir dist
          # universalOnly disables ABI splits, producing app-release.apk.
          cp "$RUNNER_TEMP/source/app/build/outputs/apk/release/app-release.apk" "dist/OpenTune-${TAG}-universal.apk"
          apk="dist/OpenTune-${TAG}-universal.apk"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
          keytool -exportcert -keystore "$OPENTUNE_KEYSTORE" -storepass:env OPENTUNE_KEYSTORE_PASSWORD -alias "$OPENTUNE_KEY_ALIAS" > "$RUNNER_TEMP/signing.der"
          expected=$(sha256sum "$RUNNER_TEMP/signing.der" | cut -d' ' -f1)
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert.txt" | tr '[:upper:]' '[:lower:]')
          test "$expected" = "$actual"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/badging.txt"
          code=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/source/custom/provenance.json"))["version_code"])')
          grep -F "package: name='com.opentune.custom' versionCode='$code' versionName='${VERSION}-custom.1'" "$RUNNER_TEMP/badging.txt"
          # Verify compilation did not alter tracked source files.
          test -z "$(git -C "$RUNNER_TEMP/source" status --porcelain --untracked-files=no)"
          python -c 'import json,os,pathlib; p=json.load(open(os.environ["RUNNER_TEMP"]+"/source/custom/provenance.json")); p["source_commit"]=os.environ["SOURCE_COMMIT"]; pathlib.Path("dist/provenance.json").write_text(json.dumps(p,indent=2)+"\n")'
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish exact source tag and APK atomically through draft
        if: steps.plan.outputs.skip != 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          UPSTREAM_TAG: ${{ steps.plan.outputs.upstream_tag }}
          UPSTREAM_SHA: ${{ steps.plan.outputs.upstream_sha }}
        run: |
          # checkout's HTTP credential helper is scoped to its checkout; use it for
          # this push without writing the token into any remote URL or source file.
          auth=$(git config --get http.https://github.com/.extraheader)
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          existing=$(git -c "http.https://github.com/.extraheader=$auth" ls-remote "$remote" "refs/tags/$TAG" | cut -f1)
          if [ -n "$existing" ] && [ "$existing" != "$SOURCE_COMMIT" ]; then
            echo '::error::Existing source tag differs from the verified build; manual inspection required'
            exit 1
          fi
          git -C "$RUNNER_TEMP/source" -c "http.https://github.com/.extraheader=$auth" push "$remote" "HEAD:refs/tags/$TAG"
          printf 'Custom build preserving New songs first.\n\nUpstream: https://github.com/justshivv/Opentune/releases/tag/%s\nUpstream commit: %s\nExact custom source: https://github.com/%s/tree/%s\n\nGPL source and original copyright notices are retained in the source tag. SHA256SUMS.txt verifies the APK.\n' "$UPSTREAM_TAG" "$UPSTREAM_SHA" "$GITHUB_REPOSITORY" "$SOURCE_COMMIT" > "$RUNNER_TEMP/notes.md"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "OpenTune Custom $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Preserve build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: custom-build-diagnostics
          path: |
            ${{ runner.temp }}/source/app/build/reports/tests/
            plan.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Report failure without duplicate issues
        if: failure()
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          title="Custom build failed: ${TAG:-release-discovery}"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          printf 'Automatic stable build stopped. Inspect patch compatibility, tests, the four OPENTUNE signing secrets, and release state before retrying.\n\nRun: https://github.com/%s/actions/runs/%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/failure.md"
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/failure.md"
          else
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/failure.md"
          fi
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/signing.der"
