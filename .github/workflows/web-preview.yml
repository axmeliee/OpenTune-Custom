name: Web preview
on:
  push:
    branches: ['feat/http-audio-addons', 'feat/tv-wear-desktop']
    paths: ['web/**', '.github/workflows/web-preview.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck && pnpm test
        working-directory: web
      - run: pnpm --filter @opentune/extension icons && pnpm build:site
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: opentune-web-preview
          path: web/app/dist
          if-no-files-found: error
