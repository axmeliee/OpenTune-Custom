name: Addon compatibility probes
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe-audio-addons.py
      - .github/workflows/addon-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe-audio-addons.py
      - uses: actions/upload-artifact@v4
        with:
          name: addon-probes
          path: build/addon-probes/
