# The iOS app: the core package's tests on Linux, then an unsigned build on
# macOS packed as an .ipa for sideloading (AltStore, SideStore, Sideloadly
# re-sign it with the installer's own Apple ID). Builds from main replace the
# .ipa on the "ios" pre-release, so it keeps one download address; the
# website lists it in a SideStore/AltStore source (see pages.yml). Being a
# pre-release, it never counts as the latest Android release.
name: iOS

on:
  push:
    branches: ["**"]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Core tests
        working-directory: ios/OpenTuneCore
        run: |
          swift --version
          swift test

  app:
    runs-on: macos-15
    timeout-minutes: 45
    needs: core
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          name="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild \
            -project OpenTune.xcodeproj \
            -scheme OpenTune \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.name }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.code }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 && status=0 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log || true
          # A failed build still leaves a partial .app behind, so the result is what counts.
          if [ "$status" -ne 0 ] || ! grep -q "BUILD SUCCEEDED" build.log; then tail -n 80 build.log; exit 1; fi
          test -x build/Build/Products/Release-iphoneos/OpenTune.app/OpenTune

      - name: Package .ipa
        id: ipa
        working-directory: ios
        run: |
          file="OpenTune-iOS-v${{ steps.version.outputs.name }}-unsigned.ipa"
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OpenTune.app Payload/
          zip -qry "$file" Payload
          ls -la "$file"
          echo "file=ios/$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenTune-iOS-unsigned
          path: ${{ steps.ipa.outputs.file }}

      - name: Publish for sideloading
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.ipa.outputs.file }}" OpenTune-iOS.ipa
          title="OpenTune for iPhone v${{ steps.version.outputs.name }}"
          notes="Unsigned build for SideStore, AltStore or Sideloadly, built from ${GITHUB_SHA::7}. In SideStore or AltStore, add the source https://justshivv.github.io/Opentune/ios/source.json to install OpenTune and get its updates on the phone."
          if gh release view ios > /dev/null 2>&1; then
            gh release edit ios --title "$title" --notes "$notes" --prerelease
          else
            gh release create ios --target "$GITHUB_SHA" --prerelease --title "$title" --notes "$notes"
          fi
          gh release upload ios OpenTune-iOS.ipa --clobber
